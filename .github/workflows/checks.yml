name: Project Checks

on:
  push:
  pull_request:

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate project files
        run: |
          python -m compileall -q scraper.py scripts/check_data.py
          python scripts/check_data.py
